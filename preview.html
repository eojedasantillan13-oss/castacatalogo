<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ver PDF</title>
  <style>
    body{
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
      background:#f4f4f4;
      font-family:Arial, sans-serif;
    }

    a{
      text-decoration:none;
      background:#007bff;
      color:white;
      padding:15px 30px;
      border-radius:10px;
      font-size:20px;
      transition:0.3s;
    }

    a:hover{
      background:#0056b3;
    }
  </style>
</head>
<body>

  <!-- Cambia el nombre si el PDF está en otra carpeta -->
  <a href="Catálogo.pdf_compressed.pdf" target="_blank">
    Abrir Catálogo PDF
  </a>

</body>
</html>
